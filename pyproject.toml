[project]
name = "feature-encoding"
version = "0.1.0"
description = "DNN feature encoding analysis to predict fMRI responses (Nonaki et al., 2021)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "bdpy>=0.24",
    "fastl2lir",
    "hydra-core",
    "numpy<2.0.0",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
visualization = [
    "jupyter>=1.1.1",
    "pycortex>=1.3.2",
]

[tool.uv]
package = false
